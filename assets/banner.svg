<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Diyorbek Tapkanov - Agricultural Engineering, AI and Smart Agriculture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1A"/>
      <stop offset="0.55" stop-color="#0A1A3A"/>
      <stop offset="1" stop-color="#140F33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E3A5F" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- field rows / detection motif -->
  <g fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.2">
    <path d="M820 270 Q960 200 1170 190"/>
    <path d="M820 270 Q980 220 1170 225"/>
    <path d="M820 270 Q1000 245 1170 260"/>
  </g>
  <g fill="none" stroke="#8B5CF6" stroke-width="1.6">
    <rect x="1010" y="70" width="96" height="70" rx="4" stroke-dasharray="10 6"/>
  </g>
  <g fill="none" stroke="#22D3EE" stroke-width="2">
    <path d="M1040 108 q14 -14 28 0 q14 -14 28 0" stroke-linecap="round"/>
  </g>
  <text x="1010" y="62" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8B5CF6">vision · detection</text>

  <rect x="64" y="72" width="56" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="138" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9">Diyorbek Tapkanov</text>
  <text x="64" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#22D3EE">Agricultural Engineering · AI · Smart Agriculture</text>
  <text x="64" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94A3B8">Computer Vision · Embedded Systems · Engineering Innovation</text>
  <text x="64" y="256" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#64748B">Tashkent, Uzbekistan  ·  TDAU  ·  Founder, NOUTSELL</text>
</svg>
